<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>West72 Events</title>
  
  <!-- Tailwind CSS for sleek, modern design -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
  
  <!-- Google Fonts (optional, clean modern font) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-md py-4 px-8 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-800">West72 Events</h1>
    <nav>
      <a href="events.html" class="text-gray-700 hover:text-blue-600 ml-4 font-medium">Events</a>
      <a href="admin.html" class="text-gray-700 hover:text-blue-600 ml-4 font-medium">Admin</a>
    </nav>
  </header>

  <!-- Main content -->
  <main class="max-w-6xl mx-auto flex-1 p-8">
    <h2 class="text-3xl font-semibold mb-6 text-gray-800">Upcoming Events</h2>
    <div id="events" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-white shadow-inner py-4 px-8 text-center text-gray-500 text-sm">
    &copy; 2026 West72 Entertainment
  </footer>

  <!-- Supabase + JS -->
  <script type="module">
    // Import Supabase client
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    // Supabase keys from environment variables (set in Vercel)
    const supabaseUrl = import.meta.env.VITE_SUPABASE_URL
    const supabaseKey = import.meta.env.VITE_SUPABASE_ANON_KEY
    const supabase = createClient(supabaseUrl, supabaseKey)

    // Load events from Supabase
    async function loadEvents() {
      const { data, error } = await supabase
        .from('events')
        .select('*')
        .order('datetime', { ascending: true })

      if (error) {
        console.error('Error loading events:', error)
        document.getElementById('events').innerHTML = '<p class="text-red-500">Failed to load events.</p>'
        return
      }

      const container = document.getElementById('events')
      container.innerHTML = '' // clear existing

      data.forEach(event => {
        const div = document.createElement('div')
        div.className = "bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300"

        div.innerHTML = `
          <img src="${event.image_url}" class="w-full h-48 object-cover">
          <div class="p-4">
            <h3 class="text-xl font-bold mb-2 text-gray-800">${event.title}</h3>
            <p class="text-gray-600 mb-1">${event.location}</p>
            <p class="text-gray-500 mb-3">${new Date(event.datetime).toLocaleString()}</p>
            <p class="text-gray-700 font-semibold mb-3">$${event.price}</p>
            <a href="event/${event.id}.html" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition-colors font-medium">Get Tickets</a>
          </div>
        `
        container.appendChild(div)
      })
    }

    loadEvents()
  </script>

</body>
</html>
