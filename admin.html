<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - West72</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0f0f0f;
      color: #f0f0f0;
    }

    input, textarea {
      background-color: #1a1a1a;
      border: 1px solid #333;
      color: #f0f0f0;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      width: 100%;
      margin-bottom: 1rem;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #ff3e00;
      box-shadow: 0 0 5px #ff3e00;
    }

    .cta-btn {
      background-color: #ff3e00;
      transition: background-color 0.3s, transform 0.3s;
    }
    .cta-btn:hover {
      background-color: #ff5c2e;
      transform: scale(1.05);
    }

    .event-card img {
      height: 150px;
      object-fit: cover;
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">

  <!-- Header -->
  <header class="flex justify-between items-center py-6 px-8 bg-gray-900 shadow-lg">
    <h1 class="text-3xl font-bold text-white">Admin Dashboard</h1>
    <nav>
      <a href="index.html" class="text-gray-300 hover:text-white ml-6 font-semibold">Home</a>
      <a href="events.html" class="text-gray-300 hover:text-white ml-6 font-semibold">Events</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto mt-8 px-4 flex-1">
    <h2 class="text-3xl font-bold mb-6">Create New Event</h2>

    <!-- Event Form -->
    <form id="event-form" class="bg-gray-800 p-6 rounded-xl shadow-lg">
      <input type="text" id="title" placeholder="Event Title" required>
      <textarea id="description" placeholder="Event Description" rows="4" required></textarea>
      <input type="text" id="location" placeholder="Location" required>
      <input type="datetime-local" id="datetime" placeholder="Date & Time" required>
      <input type="number" id="price" placeholder="Ticket Price" required>
      <input type="file" id="image" accept="image/*" required>

      <button type="submit" class="cta-btn text-white px-6 py-2 rounded font-semibold mt-2">Create Event</button>
    </form>

    <!-- Upcoming Events Preview -->
    <h2 class="text-3xl font-bold my-8">Upcoming Events</h2>
    <div id="events-list" class="grid grid-cols-1 sm:grid-cols-2 gap-6"></div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-900 mt-12 py-6 text-center text-gray-500 text-sm">
    &copy; 2026 West72 Entertainment
  </footer>

  <!-- Supabase JS -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = "https://nyyfjbsylrmgwznyjfsj.supabase.co"
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55eWZqYnN5bHJtZ3d6bnlqZnNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA1OTE5MzksImV4cCI6MjA4NjE2NzkzOX0.tPTTRI-bp2tol3w1ewLgz5FLTz-ZxzM4vHR7bVj6PTQ"
    const supabase = createClient(supabaseUrl, supabaseKey)

    const form = document.getElementById('event-form')
    const eventsList = document.getElementById('events-list')

    async function fetchEvents() {
      const { data, error } = await supabase.from('events').select('*').order('datetime', { ascending: true })
      eventsList.innerHTML = ''

      if (error) {
        eventsList.innerHTML = '<p class="text-red-500">Failed to load events.</p>'
        return
      }

      data.forEach(event => {
        const div = document.createElement('div')
        div.className = "bg-gray-800 p-4 rounded-xl shadow-lg event-card"
        div.innerHTML = `
          <img src="${event.image_url}" alt="${event.title}">
          <h3 class="font-bold text-lg mb-1">${event.title}</h3>
          <p class="text-gray-300 text-sm mb-1">${event.location}</p>
          <p class="text-gray-400 text-sm mb-1">${new Date(event.datetime).toLocaleString()}</p>
          <p class="text-orange-400 font-semibold">$${event.price}</p>
        `
        eventsList.appendChild(div)
      })
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()

      const title = document.getElementById('title').value
      const description = document.getElementById('description').value
      const location = document.getElementById('location').value
      const datetime = document.getElementById('datetime').value
      const price = document.getElementById('price').value
      const imageFile = document.getElementById('image').files[0]

      if (!imageFile) return alert("Please select an image")

      // Upload image to Supabase Storage
      const { data: uploadData, error: uploadError } = await supabase
        .storage
        .from('event-images')
        .upload(`public/${Date.now()}-${imageFile.name}`, imageFile)

      if (uploadError) return alert("Image upload failed: " + uploadError.message)

      const imageUrl = supabase.storage.from('event-images').getPublicUrl(uploadData.path).publicUrl

      // Insert new event
      const { data, error } = await supabase.from('events').insert([{
        title, description, location, datetime, price, image_url: imageUrl
      }])

      if (error) return alert("Error creating event: " + error.message)

      // Clear form
      form.reset()
      fetchEvents()
    })

    // Load events on page load
    fetchEvents()
  </script>

</body>
</html>
